<!DOCTYPE html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0d0c" />
    <meta
      name="description"
      content="D.D.E.C. S.R.L. — Diseño, desarrollo, cálculo y construcción de obras civiles en San Rafael, Mendoza."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo2.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>D.D.E.C. S.R.L. — Excelencia estructural. Orgullo regional.</title>
    <script>
      (function () {
        var d = document.documentElement;
        var st = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
        d.classList.add(st ? "is-static" : "is-anim");
        var path = location.pathname.replace(/\/+$/, "") || "/";
        var from = false;
        try { from = sessionStorage.getItem("ddec-from") === "1"; } catch (e) {}
        if (st || path !== "/" || from) d.classList.add("nointro");
        else d.classList.add("intro-lock");
      })();
    </script>
  </head>
  <body>
    <noscript>Necesitás habilitar JavaScript para ver el sitio de D.D.E.C.</noscript>
    <div id="boot-cover"></div>
    <script>
      if (document.documentElement.classList.contains("nointro")) {
        var boot = document.getElementById("boot-cover");
        if (boot) boot.remove();
      }
    </script>
    <div id="root"></div>
  </body>
</html>
